<style>
:root{color-scheme:dark;--bg:#0a0a14;--p:#7c3aed;--b:#3b82f6;--t:#e5e7eb;--c:#14142a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 20% 0,#1e1b4b,var(--bg) 60%) fixed;color:var(--t);font-family:system-ui,sans-serif;min-height:100vh}

input,select,textarea{font:inherit;background:#0f0f22;border:1px solid #2d2d55;color:var(--t);padding:10px;border-radius:10px;width:100%;margin:4px 0}
.card{background:var(--c);border:1px solid #2a2a50;border-radius:14px;padding:16px;margin-bottom:14px}.muted{color:#9ca3af;font-size:13px}
#app{display:flex}nav{width:190px;padding:16px;background:#0c0c1ccc;border-right:1px solid #2a2a50;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:20px;margin:0 0 12px;background:linear-gradient(90deg,var(--b),var(--p));-webkit-background-clip:text;color:transparent}
nav button{text-align:left;background:0;border:0;color:var(--t);padding:11px;border-radius:10px;cursor:pointer;font:inherit;transition:.2s}nav button:hover,nav button.on{background:linear-gradient(90deg,#3b82f633,#7c3aed33)}
main{flex:1;padding:20px;max-width:1000px;margin:auto;animation:in .3s;min-width:0}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{text-align:center;border:2px solid var(--c);border-radius:14px;padding:10px;background:#0f0f22;font-size:13px}
.av{width:56px;height:64px;margin:4px auto 8px;border-radius:12px;background:linear-gradient(#facc15 0 30%,var(--k) 30%);box-shadow:0 0 var(--g) var(--c)}
.lock{opacity:.45;filter:grayscale(.8)}.R-Lendária .av{animation:pl 1.5s infinite}.R-Mítica .av{animation:pl 1.5s infinite,hue 4s linear infinite}.R-Exclusiva{background:linear-gradient(135deg,#0f0f22,#1e1b4b,#0f0f22)}.R-Exclusiva .av{animation:pl 1s infinite,hue 2s linear infinite}

body{background:linear-gradient(180deg,#2a1040,#7c2d12 70%,#c2410c) fixed}

const hashPw=async(pw,salt)=>{if(!(window.crypto&&crypto.subtle))throw Error('Seu navegador não permite criptografia aqui. Tente abrir pelo claude.ai.');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:100000,hash:'SHA-256'},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

const reg=wrap(async()=>{const n=$('#u').value.trim(),pw=$('#pw').value;if(!/^\w{3,16}$/.test(n))throw Error('Use 3 a 16 letras, números ou _');if(pw.length<4)throw Error('A senha precisa ter pelo menos 4 caracteres');const k='names/'+n.toLowerCase();if((await db.doc(k).get()).exists)throw Error('Nome já existente');const salt=crypto.randomUUID(),id='a'+crypto.randomUUID().replace(/-/g,'');await db.doc(k).set({uid:id,salt,hash:await hashPw(pw,salt)});await db.doc('players/'+id).set({name:n,coins:100,owned:['s0'],eq:'s0',runs:0,created:Date.now(),claimed:[],read:[]});localStorage.acc=id;await boot()});

async mail(){const m=(await db.collection('inbox/'+uid+'/msgs').get()).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.t-a.t);const rd=P.read||[];return `<h2>Correio</h2>${m.length?m.map(x=>{const cl=(P.claimed||[]).includes(x.id),r=x.coins||x.skin;return `<div class="card ${rd.includes(x.id)?'':'unread'}"><b>${esc(x.title)}</b> <span class="muted">${new Date(x.t).toLocaleString('pt-BR')}</span><p>${esc(x.body)}</p>${r?`<p>🎁 ${x.coins?'🪙 '+x.coins+' ':''}${x.skin?'Skin: '+(x.skin=='ALL'?'Todas':sk(x.skin).name):''}</p><button class="btn" ${cl?'disabled':''} onclick="claim('${x.id}',${x.coins||0},'${x.skin||''}')">${cl?'Resgatado':'Resgatar'}</button> `:''}${rd.includes(x.id)?'':`<button class="btn g" onclick="markRead('${x.id}')">Marcar como lida</button>`}</div>`}).join(''):'<p class="muted">Nenhuma mensagem.</p>'}`},
profile:()=>`<h2>${esc(P.name)} ${tagH(tagOf())}</h2><div class="card">${tagOf()=='Influencer'?'<p>⭐ <b>Influencer</b>: todas as skins desbloqueadas</p>':''}<p>Cadastro: ${new Date(P.created).toLocaleDateString('pt-BR')}</p><p>🪙 ${P.coins} · 🎨 ${owned().length}/${S.length} skins · 🏁 ${P.runs} corridas</p><p>Melhor No Coin: ${fmt(P.bestNoT)}<br>Maior pontuação: ${P.bestScore??'—'}</p></div>`,
async rank(){const pl=(await db.collection('players').get()).docs.map(d=>({id:d.id,...d.data()})),t=(l,k,asc,f)=>{const a=pl.filter(p=>p[k]!=null).sort((x,y)=>asc?x[k]-y[k]:y[k]-x[k]),i=a.findIndex(p=>p.id==uid);return `<div class="card"><h3>${l}</h3><table>${a.slice(0,10).map((p,j)=>`<tr><td>${j+1}</td><td>${esc(p.name)}</td><td>${f(p[k])}</td></tr>`).join('')||'<tr><td class="muted">Sem registros ainda</td></tr>'}</table><p class="muted">Sua posição: ${i>=0?'#'+(i+1):'—'}</p></div>`};return `<h2>Ranking global</h2>${t('⏱️ No Coin (tempo sem pegar moeda)','bestNoT',0,fmt)}`},
settings:()=>`<h2>Configurações</h2><div class="card"><label><input type="checkbox" style="width:auto" ${fxOn()?'checked':''} onchange="localStorage.fx=this.checked?1:0"> Efeitos de brilho no jogo</label><br><label><input type="checkbox" style="width:auto" ${localStorage.snd!=='0'?'checked':''} onchange="localStorage.snd=this.checked?1:0"> Sons</label><p class="muted">O progresso é salvo automaticamente na sua conta.</p><button class="btn g" onclick="stopGame();localStorage.removeItem('acc');regScreen(1)">Sair da conta</button></div>`,
admin:()=>`<h2>Painel Admin</h2><div class="card"><input id="aq" placeholder="Buscar jogador..." oninput="adminShow()"><div style="overflow:auto" id="al"></div></div><div id="ad"></div>`};

function mkVeh(t,col){const g=new THREE.Group(),bus=t=='bus';const L=bus?9:4.2;for(const sx of[-1,1])for(const sz of[-1,1]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.3,16).rotateZ(Math.PI/2),mat(0x0b0b0b));w.position.set(sx*(bus?1.3:1.1),.42,sz*L*.32);g.add(w)}for(const sx of[-.7,.7])for(const e of[[-1,0xfff7c2],[1,0xdc2626]]){const hl=new THREE.Mesh(new THREE.BoxGeometry(.5,.25,.08),new THREE.MeshBasicMaterial({color:e[1]}));hl.position.set(sx,bus?1.1:.65,e[0]*(L/2+.02));g.add(hl)}if(bus){g.add(box(2.6,3,9,col,0,.5),box(2.65,.9,8.6,0x1e3a5f,0,1.9))}else{g.add(box(2.2,.9,4.2,col,0,.45),box(1.9,.7,2.2,0x93c5fd,0,1.3,.2))}

const adminLoad=wrap(async()=>{AP=(await db.collection('players').get()).docs.map(d=>({id:d.id,...d.data()}));AT={};(await db.collection('tags').get()).docs.forEach(d=>AT[d.id]=d.data());adminShow()});
function adminShow(){const q=($('#aq')?.value||'').toLowerCase(),a=AP.filter(p=>p.name.toLowerCase().includes(q));$('#al').innerHTML=`<table><tr><th>Usuário</th><th>Cadastro</th><th>Skins</th><th>Status</th><th></th></tr>${a.map(p=>{const t=AT[p.id]||{};return `<tr><td>${esc(p.name)}${tagH(p.id==uid?'Administrador':t.tag||'Jogador')}<div class="muted">${p.id.slice(0,8)}</div></td><td>${new Date(p.created).toLocaleDateString('pt-BR')}</td><td>${t.tag=='Influencer'?S.length:new Set([...p.owned,...(t.skins||[])]).size}</td><td>${t.blocked?'🚫':'Ativa'}</td><td><button class="btn g" onclick="pick('${p.id}')">Gerenciar</button></td></tr>`}).join('')}</table>`;if(sel)pick(sel)}
